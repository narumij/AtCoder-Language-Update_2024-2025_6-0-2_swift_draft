name: Prebuilt Swift libraries
on:
  push:
    branches: [main, 'test/**', 'develop/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: prebuilt-swift-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - name: Check generated judge definition
        run: |
          bash prebuilt/render.sh --check
          for script in prebuilt/*.sh dist/install.sh test/*.sh; do
            bash -n "$script"
          done
      - name: Install from judge definition
        run: |
          set -o pipefail
          mkdir -p diagnostics
          bash test/extract.sh install > diagnostics/install.sh
          bash diagnostics/install.sh 2>&1 | tee diagnostics/install.log
      - name: Record compiler and dependency versions
        run: |
          bash test/check_version.sh | tee diagnostics/compiler.txt
          cp SwiftLibraries/config.sh SwiftLibraries/Package.resolved diagnostics/
          dpkg-query -W 'libopenblas*' 'liblapacke*' > diagnostics/system-libraries.txt
      - name: Remove build inputs before compiling submissions
        run: |
          rm -rf prebuilt/.build
          mkdir -p diagnostics/hidden
          mv prebuilt/Package.swift prebuilt/Package.resolved diagnostics/hidden/
      - name: Verify isolated submission compilation and execution
        run: |
          set -o pipefail
          bash test/test.sh SwiftLibraries 2>&1 | tee diagnostics/test.log
      - name: Verify judge compile and execution commands
        run: |
          grep -qx "filename = 'main.swift'" dist/swift.toml
          grep -qx "object = 'main'" dist/swift.toml
          grep -Fxq "execution = ['main']" dist/swift.toml
          printf 'import Collections\nprint(Deque([42]).first!)\n' > main.swift
          bash test/extract.sh compile > diagnostics/compile.sh
          bash diagnostics/compile.sh
          ./main > diagnostics/actual.out
          printf '42\n' > diagnostics/expected.out
          diff -u diagnostics/expected.out diagnostics/actual.out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swift-prebuilt-diagnostics
          path: diagnostics/
          if-no-files-found: warn
